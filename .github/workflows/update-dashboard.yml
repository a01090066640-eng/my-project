name: Update dashboard

on:
  schedule:
    # 22:30 UTC = 07:30 KST, every day
    - cron: '30 22 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - claude/laughing-bardeen-39546n

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Only fetch fresh data on the schedule / manual trigger; a plain push
    # already has its own data and just needs building + deploying.
    if: github.event_name != 'push'
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch indicators
        run: python3 pipeline/fetch_all.py

      - name: Build dashboard data
        run: python3 pipeline/build_dashboard_data.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- pipeline/data src/data/liveData.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "dashboard-pipeline[bot]"
          git config user.email "dashboard-pipeline[bot]@users.noreply.github.com"
          git add pipeline/data src/data/liveData.json
          git commit -m "chore(data): daily indicator refresh $(date -u +%Y-%m-%d)"
          git push

  build-and-deploy:
    needs: update-data
    if: always() && (needs.update-data.result == 'skipped' || needs.update-data.outputs.changed == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
